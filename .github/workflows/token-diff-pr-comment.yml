name: Token Diff Generate
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  token-diff-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save report for comment workflow
        run: |
          mkdir -p /tmp/artifact
          echo "2" > /tmp/artifact/pr-number.txt
          echo "true" > /tmp/artifact/diff-generated.txt
          printf '%s\n' "aGVsbG8=" > /tmp/artifact/diff-content.txt
      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-diff-report
          path: /tmp/artifact
          retention-days: 1
